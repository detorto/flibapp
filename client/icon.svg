  <!-- Book spine -->
  <path d="M52.5,28 L55.5,28 L55.5,73 L52.5,73 Z" fill="#B0BEC5"/>

  <!-- Left page lines -->
  <line x1="28" y1="43" x2="49" y2="38" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="28" y1="50" x2="49" y2="45" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="28" y1="57" x2="49" y2="52" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="28" y1="64" x2="49" y2="59" stroke="#90A4AE" stroke-width="1.5"/>

  <!-- "F" letter on right page -->
  <path d="M62,42 L78,45.5 M62,42 L62,62 M62,52 L75,54.5" stroke="#1565C0" stroke-width="3" stroke-linecap="round" fill="none"/>
